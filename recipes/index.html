<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Drew's virtual cookbook — recipes with swipeable, timer-guided cook mode, scalable by servings." />
    <meta name="recipes-base" content="." />
    <title>Drew's Recipes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>" />
    <meta property="og:title" content="Drew's Recipes" />
    <meta property="og:description" content="A virtual cookbook — swipeable step-by-step cook mode with built-in timers, scalable servings." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://drewklauser.com/recipes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" /></noscript>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <nav class="site-nav">
      <div class="site-nav-inner">
        <a href="/" class="nav-back"><span aria-hidden="true">←</span> Drew Klauser</a>
      </div>
    </nav>

    <header class="hero">
      <h1 class="hero-title">Drew's Recipes</h1>
      <p class="hero-subtitle" id="hero-subtitle">Loading…</p>
    </header>

    <div class="page-container">
      <div class="recipes-search-wrap">
        <svg class="recipes-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="recipes-search" type="search" class="recipes-search" placeholder="Search recipes…" aria-label="Search recipes by title or tag" autocomplete="off" />
      </div>

      <div class="filter-row">
        <span class="filter-label">Category</span>
        <div class="filter-pills" id="cat-pills">
          <button class="filter-pill filter-pill--active" data-filter-type="cat" data-filter-val="">All</button>
        </div>
      </div>
      <div class="filter-row">
        <span class="filter-label">Difficulty</span>
        <div class="filter-pills" id="diff-pills">
          <button class="filter-pill filter-pill--active" data-filter-type="diff" data-filter-val="">All</button>
        </div>
      </div>

      <div id="recipes-grid" class="recipes-grid"></div>

      <div id="recipes-empty" style="display:none;text-align:center;padding:3rem 1rem;">
        <p style="font-size:1.05rem;font-weight:600;margin-bottom:0.4rem;">No recipes found</p>
        <p style="font-size:0.875rem;color:var(--c-text-2);">Try a different search or filter.</p>
      </div>
    </div>

    <footer style="text-align:center;padding:2rem 1rem;border-top:1px solid var(--c-border);">
      <p style="font-size:0.72rem;font-family:'JetBrains Mono',monospace;color:var(--c-text-2);letter-spacing:0.05em;">
        Add a recipe by editing recipes.yaml · <a href="/" style="color:var(--c-accent);text-decoration:none;">drewklauser.com</a>
      </p>
    </footer>

    <!-- Recipe detail modal (single instance, populated by JS) -->
    <dialog id="recipe-modal" class="recipe-modal" aria-label="Recipe details">
      <div class="modal-inner">
        <button class="modal-close" aria-label="Close" onclick="document.getElementById('recipe-modal').close()">×</button>
        <div class="modal-hero" id="modal-hero-wrap"></div>
        <div id="modal-categories" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:0.6rem;"></div>
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-subrow">
          <span id="modal-cuisine"></span>
          <span id="modal-difficulty" style="font-weight:600;text-transform:capitalize;"></span>
          <span id="modal-time"></span>
        </div>

        <div class="servings-stepper">
          <button class="servings-btn" id="modal-servings-minus" aria-label="Fewer servings">−</button>
          <span class="servings-display"><span id="modal-servings-count"></span> <span id="modal-servings-unit"></span></span>
          <button class="servings-btn" id="modal-servings-plus" aria-label="More servings">+</button>
        </div>

        <ul class="ingredients-list" id="modal-ingredients"></ul>

        <p id="modal-notes" style="font-size:0.85rem;color:var(--c-text-2);line-height:1.6;margin-bottom:0.5rem;display:none;"></p>

        <button class="btn-start-cooking" id="modal-start-cooking">
          Start Cooking
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </dialog>

    <script src="vendor/js-yaml.min.js"></script>
    <script src="assets/lib.js"></script>
    <script src="assets/home.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />
    <meta name="recipes-base" content=".." />
    <title>Cook Mode — Drew's Recipes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍳</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" /></noscript>
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body class="cook-body">
    <div class="cook-top-sticky">
      <header class="cook-header">
        <a href="../" class="cook-back" aria-label="Back to recipes">←</a>
        <span class="cook-title" id="cook-title">Loading…</span>
        <div style="display:flex;gap:0.5rem;margin-left:auto;">
          <button class="cook-back" id="ingredients-toggle" aria-label="Show ingredient checklist" style="position:relative;">
            🧾
            <span class="ingredients-badge" id="ingredients-badge" style="display:none;"></span>
          </button>
          <button class="cook-back" id="cook-share-btn" aria-label="Share recipe">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
          </button>
        </div>
      </header>

      <nav class="cook-progress" id="cook-progress" aria-label="Step progress"></nav>

      <div class="timer-tray" id="timer-tray"></div>
    </div>

    <main class="cook-stage" id="cook-stage">
      <p style="color:var(--c-text-2);">Loading recipe…</p>
    </main>

    <nav class="cook-nav">
      <button class="cook-nav-btn" id="cook-prev" disabled>← Back</button>
      <button class="cook-nav-btn cook-nav-btn--primary" id="cook-next">Next →</button>
    </nav>

    <dialog id="ingredients-sheet" class="ingredients-sheet">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h2 style="font-family:var(--font);font-size:1.05rem;font-weight:700;">Ingredients</h2>
        <button class="modal-close" style="position:static;" aria-label="Close" onclick="document.getElementById('ingredients-sheet').close()">×</button>
      </div>
      <p style="font-size:0.8rem;color:var(--c-text-2);margin-top:0.25rem;" id="ingredients-servings-note"></p>
      <ul class="check-list" id="ingredients-checklist"></ul>
    </dialog>

    <script src="../vendor/js-yaml.min.js"></script>
    <script src="../assets/lib.js"></script>
    <script src="../assets/cook.js"></script>
  </body>
</html>

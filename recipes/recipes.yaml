  - title: "Smoked Pulled Pork Butt"
    author: "Drew"
    cuisine: American
    categories: [Dinner]
    difficulty: medium
    prep_minutes: 20
    cook_minutes: 360
    servings: 12
    tags: [bbq, smoker, make-ahead]
    image: null
    ingredients:
      - "7-8 lb pork butt"
      - "yellow mustard, enough to coat"
      - "your favorite BBQ dry rub/seasoning, enough to coat"
      - "1/4 cup apple cider vinegar"
      - "1/2 stick (4 tbsp) butter, sliced"
    steps:
      - text: "Slather the pork butt in mustard on all sides — it's a binder, not a flavor you'll taste in the end."
      - text: "Coat generously in your seasoning/dry rub."
      - text: "Tie the roast with butcher's twine so smaller pieces don't fall off or cook faster than the rest."
      - text: "Smoke at 250°F, monitoring the internal temperature."
      - text: "At 165°F internal, pull it off the smoker. Set it in a foil tray with the apple cider vinegar and sliced butter around it, and wrap tightly in foil."
      - text: "Return to the smoker and continue cooking until the internal temperature reaches 204°F."
      - text: "Rest before pulling."
    notes: "Times are approximate — this took about 6 hours for a 7.18 lb butt at 250°F. Always cook to internal temperature, not the clock."

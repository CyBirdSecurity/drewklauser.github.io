  - title: "Bourbon Pumpkin Bread"
    author: "Drew"
    cuisine: American
    categories: [Baking, Dessert]
    difficulty: medium
    prep_minutes: 20
    cook_minutes: 50
    servings: 2
    yield_label: "loaves"
    tags: [fall, bourbon, pumpkin]
    image: null
    ingredients:
      - qty: 0.5
        unit: cup
        item: unsalted butter
      - qty: 0.25
        unit: cup
        item: bourbon
      - qty: 1
        unit: tbsp
        item: vanilla
      - qty: 1.75
        unit: cup
        item: "pumpkin puree (15 oz)"
      - qty: 4
        unit: whole
        item: eggs
      - qty: 0.5
        unit: cup
        item: olive oil
      - qty: 2
        unit: cup
        item: flour
      - qty: 1
        unit: cup
        item: whole wheat flour
      - qty: 1.75
        unit: cup
        item: light brown sugar
      - qty: 1.5
        unit: tsp
        item: baking soda
      - qty: 1
        unit: tsp
        item: fine sea salt
      - qty: 1
        unit: tsp
        item: ground cinnamon
      - qty: 0.5
        unit: tsp
        item: ground ginger
      - qty: 0.5
        unit: tsp
        item: ground cardamom
      - "water, to bring the bourbon mixture up to 2/3 cup"
    steps:
      - text: "Heat the oven to 350°F. Grease two 8-inch loaf pans with butter or line with parchment paper."
      - text: "Melt the butter in a large skillet over medium-high heat, then reduce to medium and cook until the milk solids brown and smell nutty, 5-7 minutes. Watch closely — it can burn fast."
        timer_minutes: 7
        ingredients: [0]
      - text: "In a measuring cup, combine the bourbon and vanilla, then add water until you reach the 2/3 cup mark."
        ingredients: [1, 2, 14]
      - text: "In a large bowl, whisk together the bourbon mixture, pumpkin puree, eggs, and oil. Scrape in the brown butter and stir to combine."
        ingredients: [3, 4, 5]
      - text: "In another bowl, whisk together both flours, brown sugar, baking soda, salt, cinnamon, ginger, and cardamom. Pour the wet ingredients into the dry and stir to combine."
        ingredients: [6, 7, 8, 9, 10, 11, 12, 13]
      - text: "Divide the batter between the two loaf pans. Bake 50-60 minutes, until a tester inserted in the center comes out clean. Cool completely before removing from the pans."
        timer_minutes: 55
    notes: "Adapted from https://www.onceuponachef.com/recipes/spiced-pumpkin-bread.html. Ran about 50 minutes in metal loaf pans — check closer to 60 minutes if using glass or ceramic."


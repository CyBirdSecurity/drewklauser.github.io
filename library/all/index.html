<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Every book Drew has read — searchable and filterable by category and year." />
    <meta name="library-base" content=".." />
    <title>All Books — Drew's Library</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <meta property="og:title" content="All Books — Drew's Library" />
    <meta property="og:description" content="Every book Drew has read — searchable and filterable by category and year." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://drewklauser.com/library/all" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" /></noscript>
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body>
    <!-- Compact hero -->
    <header style="position:relative;z-index:1;padding:5rem 2rem 2rem;text-align:center;">
      <h1 style="font-family:var(--font-serif);font-size:clamp(2rem,5vw,3.5rem);font-weight:600;letter-spacing:-0.015em;color:var(--c-text);">All Books</h1>
      <p style="font-family:'JetBrains Mono',monospace;font-size:0.875rem;color:var(--c-accent);margin-top:0.5rem;letter-spacing:0.08em;" id="books-count">Loading…</p>
    </header>

    <!-- Nav (back to Library) -->
    <nav class="site-nav">
      <div style="max-width:1400px;margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:100%;">
        <a href="/" style="display:inline-flex;align-items:center;gap:0.4rem;font-family:var(--font-serif);font-size:0.95rem;font-weight:600;letter-spacing:-0.01em;color:var(--c-text-2);text-decoration:none;transition:color 0.15s;"
          onmouseover="this.style.color='var(--c-text)'"
          onmouseout="this.style.color='var(--c-text-2)'">
          <span aria-hidden="true">←</span> Drew Klauser
        </a>
        <div style="display:flex;gap:2rem;align-items:center;">
          <a href="../" style="font-family:'JetBrains Mono',monospace;font-size:0.72rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--c-text-2);text-decoration:none;transition:color 0.15s;" onmouseover="this.style.color='var(--c-accent)'" onmouseout="this.style.color='var(--c-text-2)'">← Library</a>
        </div>
      </div>
    </nav>

    <!-- Controls: search + filters -->
    <div style="position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:2rem 2rem 1rem;">
      <!-- Search -->
      <div class="books-search-wrap">
        <svg class="books-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input
          id="books-search"
          type="search"
          class="books-search"
          placeholder="Search title or author…"
          aria-label="Search books by title or author"
          autocomplete="off"
        />
      </div>

      <!-- Category filter -->
      <div class="filter-row">
        <span class="filter-label">Category</span>
        <div class="filter-pills" id="cat-pills">
          <button class="filter-pill filter-pill--active" data-filter-type="cat" data-filter-val="">All</button>
        </div>
      </div>

      <!-- Year filter -->
      <div class="filter-row" style="margin-top:0.75rem;">
        <span class="filter-label">Year</span>
        <div class="filter-pills" id="year-pills">
          <button class="filter-pill filter-pill--active" data-filter-type="year" data-filter-val="">All Years</button>
        </div>
      </div>
    </div>

    <!-- Books grid -->
    <div id="books-grid" class="all-books-grid" style="position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:0 2rem 5rem;"></div>

    <!-- Empty state -->
    <div id="books-empty" style="display:none;position:relative;z-index:1;text-align:center;padding:4rem 2rem;">
      <p style="font-size:1.1rem;font-weight:500;color:var(--c-text);margin-bottom:0.5rem;">No books found</p>
      <p style="font-size:0.875rem;color:var(--c-text-2);">Try a different search or filter.</p>
    </div>

    <!-- Book detail modal (single instance, populated by JS) -->
    <dialog id="book-modal" class="book-modal" aria-label="Book details">
      <div class="modal-inner">
        <button class="modal-close" aria-label="Close" onclick="document.getElementById('book-modal').close()">×</button>
        <div class="modal-cover" id="modal-cover-wrap"></div>
        <div style="flex:1;min-width:0;">
          <div id="modal-categories" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:0.75rem;"></div>
          <h2 class="modal-title">
            <a id="modal-title" target="_blank" rel="noopener noreferrer"
               style="color:inherit;text-decoration:none;border-bottom:1px solid rgba(22,60,37,0.25);transition:border-color 0.15s;"
               onmouseover="this.style.borderColor='rgba(22,60,37,0.7)'"
               onmouseout="this.style.borderColor='rgba(22,60,37,0.25)'"></a>
          </h2>
          <p class="modal-author" id="modal-author"></p>
          <div style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-top:0.5rem;">
            <span class="medium-badge" id="modal-medium"></span>
            <span style="font-size:0.8rem;color:var(--c-text-2);" id="modal-year"></span>
          </div>
          <p id="modal-notes" style="margin-top:1rem;font-size:0.875rem;color:var(--c-text-2);line-height:1.6;display:none;"></p>
        </div>
      </div>
    </dialog>

    <script src="../vendor/js-yaml.min.js"></script>
    <script src="../assets/lib.js"></script>
    <script src="../assets/all.js"></script>
  </body>
</html>
